<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Cable with exposed inner colored wires -->
  <!-- Main outer sheath - curved -->
  <path d="M5 50 C25 48, 50 42, 70 38"/>
  <path d="M5 60 C25 58, 50 52, 70 48"/>
  <!-- Outer sheath end (cut/stripped) -->
  <ellipse cx="70" cy="43" rx="3" ry="5"/>
  <!-- Exposed inner wires splaying out -->
  <path d="M73 40 C80 35, 90 28, 105 18" stroke-width="2.5"/>
  <path d="M73 42 C82 38, 95 35, 110 30" stroke-width="2.5"/>
  <path d="M73 44 C84 42, 98 42, 112 42" stroke-width="2.5"/>
  <path d="M73 46 C82 48, 95 52, 108 56" stroke-width="2.5"/>
  <!-- Printed text on outer sheath -->
  <line x1="18" y1="52" x2="28" y2="50" stroke-width="2.5"/>
  <line x1="32" y1="49" x2="36" y2="48" stroke-width="2.5"/>
  <line x1="42" y1="46" x2="52" y2="44" stroke-width="2.5"/>
  <!-- Cable brand logo marks -->
  <circle cx="56" cy="43" r="2" stroke-width="2"/>
  <circle cx="60" cy="42" r="2" stroke-width="2"/>
</svg>