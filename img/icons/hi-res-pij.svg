<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Hi-Res Piezo Inkjet (PIJ) Printer -->
  <!-- Main printer body -->
  <rect x="12" y="20" width="50" height="40" rx="3"/>
  <!-- Front panel detail -->
  <rect x="16" y="26" width="20" height="14" rx="2"/>
  <rect x="18" y="28" width="16" height="10" rx="1"/>
  <!-- Status indicators -->
  <circle cx="42" cy="30" r="2"/>
  <circle cx="48" cy="30" r="2"/>
  <circle cx="54" cy="30" r="2"/>
  <!-- Print head section (bottom) -->
  <rect x="16" y="48" width="42" height="8" rx="1.5"/>
  <!-- Hi-res nozzle array (many fine lines) -->
  <line x1="20" y1="56" x2="20" y2="62"/>
  <line x1="24" y1="56" x2="24" y2="62"/>
  <line x1="28" y1="56" x2="28" y2="62"/>
  <line x1="32" y1="56" x2="32" y2="62"/>
  <line x1="36" y1="56" x2="36" y2="62"/>
  <line x1="40" y1="56" x2="40" y2="62"/>
  <line x1="44" y1="56" x2="44" y2="62"/>
  <line x1="48" y1="56" x2="48" y2="62"/>
  <line x1="52" y1="56" x2="52" y2="62"/>
  <!-- Ink reservoir (right side) -->
  <rect x="64" y="24" width="18" height="32" rx="2"/>
  <rect x="67" y="28" width="12" height="24" rx="1"/>
  <!-- Ink level -->
  <rect x="69" y="36" width="8" height="14" rx="0.5" stroke-dasharray="2 2"/>
  <!-- Conveyor belt -->
  <line x1="4" y1="68" x2="96" y2="68" stroke-width="2"/>
  <circle cx="8" cy="68" r="3"/>
  <circle cx="92" cy="68" r="3"/>
  <!-- Product on belt -->
  <rect x="30" y="63" width="20" height="5" rx="1"/>
  <!-- Printed text on product (hi-res dots) -->
  <line x1="33" y1="65" x2="35" y2="65" stroke-width="1"/>
  <line x1="37" y1="65" x2="39" y2="65" stroke-width="1"/>
  <line x1="41" y1="65" x2="43" y2="65" stroke-width="1"/>
  <line x1="45" y1="65" x2="47" y2="65" stroke-width="1"/>
  <!-- Cable -->
  <path d="M62 30 C66 28, 64 24, 62 22" stroke-width="2"/>
  <!-- Mounting bracket -->
  <line x1="12" y1="60" x2="12" y2="68"/>
  <line x1="62" y1="60" x2="62" y2="68"/>
  <!-- "Hi-Res" quality indicator - magnifying glass -->
  <circle cx="82" cy="78" r="8"/>
  <line x1="88" y1="84" x2="92" y2="88" stroke-width="3"/>
  <!-- Dots inside magnifier (hi-res detail) -->
  <circle cx="79" cy="76" r="1" fill="currentColor"/>
  <circle cx="82" cy="76" r="1" fill="currentColor"/>
  <circle cx="85" cy="76" r="1" fill="currentColor"/>
  <circle cx="79" cy="79" r="1" fill="currentColor"/>
  <circle cx="82" cy="79" r="1" fill="currentColor"/>
  <circle cx="85" cy="79" r="1" fill="currentColor"/>
</svg>
