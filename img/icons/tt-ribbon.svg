<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Thermal Transfer Ribbon - ribbon rolls/spools -->
  <!-- Large ribbon roll (center) -->
  <ellipse cx="40" cy="50" rx="14" ry="24"/>
  <ellipse cx="40" cy="50" rx="6" ry="10"/>
  <!-- Ribbon unspooling from large roll -->
  <path d="M54 42 C60 38, 68 36, 76 38" stroke-width="2"/>
  <path d="M54 58 C60 62, 68 64, 76 62" stroke-width="2"/>
  <!-- Small ribbon roll (right, stacked) -->
  <ellipse cx="76" cy="30" rx="10" ry="16"/>
  <ellipse cx="76" cy="30" rx="4" ry="7"/>
  <!-- Tiny ribbon roll (far right) -->
  <ellipse cx="88" cy="58" rx="6" ry="10"/>
  <ellipse cx="88" cy="58" rx="2.5" ry="4"/>
  <!-- Label on large roll -->
  <rect x="32" y="44" width="16" height="12" rx="1"/>
  <line x1="35" y1="48" x2="45" y2="48"/>
  <line x1="35" y1="52" x2="43" y2="52"/>
  <!-- Label on small roll -->
  <rect x="70" y="26" width="12" height="8" rx="1"/>
  <line x1="72" y1="30" x2="80" y2="30"/>
  <!-- Blue ribbon (accent, slightly left) -->
  <ellipse cx="20" cy="36" rx="8" ry="14"/>
  <ellipse cx="20" cy="36" rx="3" ry="6"/>
</svg>
