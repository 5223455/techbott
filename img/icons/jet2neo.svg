<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Main body - stainless steel boxy CIJ printer -->
  <rect x="12" y="24" width="58" height="46" rx="2"/>
  <!-- Sloped top panel -->
  <path d="M12 24 L32 12 L82 12 L70 24" fill="none"/>
  <line x1="32" y1="12" x2="32" y2="12"/>
  <!-- Right side panel -->
  <rect x="70" y="24" width="12" height="46" rx="1"/>
  <line x1="82" y1="24" x2="82" y2="12"/>
  <!-- Touchscreen on front face -->
  <rect x="18" y="30" width="24" height="16" rx="2"/>
  <rect x="20" y="32" width="20" height="12" rx="1"/>
  <!-- Status buttons below screen -->
  <circle cx="22" cy="54" r="2.5"/>
  <circle cx="30" cy="54" r="2.5"/>
  <circle cx="38" cy="54" r="2.5"/>
  <!-- Vertical slot on right panel -->
  <line x1="76" y1="32" x2="76" y2="60"/>
  <!-- Base plate -->
  <rect x="8" y="70" width="76" height="4" rx="1"/>
  <!-- Print head (cylindrical tube extending from bottom-right) -->
  <line x1="72" y1="74" x2="72" y2="78"/>
  <ellipse cx="72" cy="80" rx="4" ry="2"/>
  <line x1="68" y1="80" x2="68" y2="80"/>
  <rect x="66" y="78" width="24" height="6" rx="3"/>
  <!-- Cable from print head -->
  <path d="M86 78 C88 74, 84 72, 82 70" stroke-width="2"/>
</svg>
