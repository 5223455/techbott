<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Main body - Jet 3Eco CIJ printer (wider, more modern) -->
  <rect x="10" y="20" width="62" height="48" rx="2"/>
  <!-- Sloped top -->
  <path d="M10 20 L26 8 L84 8 L72 20" fill="none"/>
  <line x1="84" y1="8" x2="84" y2="20"/>
  <!-- Right side panel -->
  <rect x="72" y="20" width="12" height="48" rx="1"/>
  <!-- Large touchscreen -->
  <rect x="15" y="24" width="30" height="22" rx="2"/>
  <rect x="17" y="26" width="26" height="18" rx="1"/>
  <!-- Menu icons on screen -->
  <circle cx="24" cy="35" r="1.5"/>
  <circle cx="30" cy="35" r="1.5"/>
  <circle cx="36" cy="35" r="1.5"/>
  <!-- Status indicators -->
  <circle cx="52" cy="30" r="2"/>
  <circle cx="52" cy="38" r="2"/>
  <!-- Ventilation grille on front -->
  <line x1="16" y1="52" x2="48" y2="52"/>
  <line x1="16" y1="55" x2="48" y2="55"/>
  <line x1="16" y1="58" x2="48" y2="58"/>
  <!-- Base plate -->
  <rect x="6" y="68" width="80" height="4" rx="1"/>
  <!-- Print head tube -->
  <rect x="68" y="72" width="26" height="6" rx="3"/>
  <!-- Cable -->
  <path d="M90 72 C92 68, 88 66, 84 68" stroke-width="2"/>
</svg>
