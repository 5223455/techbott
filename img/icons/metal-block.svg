<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Metal block - isometric cube with laser-engraved numbers -->
  <!-- Top face -->
  <path d="M50 10 L90 30 L50 50 L10 30 Z"/>
  <!-- Left face -->
  <path d="M10 30 L10 70 L50 90 L50 50 Z"/>
  <!-- Right face -->
  <path d="M90 30 L90 70 L50 90 L50 50 Z"/>
  <!-- Engraved text lines on right face -->
  <line x1="58" y1="58" x2="82" y2="46" stroke-width="2.5"/>
  <line x1="58" y1="64" x2="78" y2="53" stroke-width="2.5"/>
  <line x1="58" y1="70" x2="74" y2="60" stroke-width="2.5"/>
  <!-- Engraved text lines on left face -->
  <line x1="18" y1="46" x2="42" y2="58" stroke-width="2.5"/>
  <line x1="18" y1="52" x2="38" y2="63" stroke-width="2.5"/>
  <!-- Small second block behind -->
  <path d="M55 5 L75 15 L55 25 L35 15 Z" stroke-width="2.5"/>
  <line x1="75" y1="15" x2="75" y2="22" stroke-width="2.5"/>
</svg>