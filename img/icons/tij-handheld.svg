<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 110" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- TIJ Handheld - gun-shaped printer -->
  <!-- Screen/display on top -->
  <rect x="12" y="8" width="42" height="28" rx="3"/>
  <rect x="16" y="12" width="34" height="20" rx="2"/>
  <!-- Cartridge slot on right side -->
  <rect x="54" y="12" width="14" height="20" rx="1"/>
  <line x1="58" y1="14" x2="58" y2="30"/>
  <!-- Print head area bottom of screen -->
  <rect x="18" y="36" width="30" height="8" rx="1"/>
  <!-- Grip handle (ergonomic pistol grip) -->
  <path d="M28 44 L24 58 L22 78 L20 90 Q18 96 24 98 L38 98 Q44 96 42 90 L40 78 L38 58 L34 44" fill="none"/>
  <!-- Trigger -->
  <path d="M30 58 C32 64, 36 64, 38 58" stroke-width="2"/>
  <!-- Grip texture lines -->
  <line x1="26" y1="72" x2="36" y2="72"/>
  <line x1="25" y1="76" x2="37" y2="76"/>
  <line x1="25" y1="80" x2="37" y2="80"/>
  <line x1="24" y1="84" x2="38" y2="84"/>
  <!-- Nozzle at bottom of print head -->
  <line x1="33" y1="44" x2="33" y2="50"/>
  <rect x="30" y="50" width="6" height="3" rx="1"/>
</svg>
