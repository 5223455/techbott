<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Base with T-slot profile -->
  <rect x="18" y="100" width="64" height="6" rx="1.5"/>
  <rect x="22" y="96" width="56" height="4" rx="1"/>
  <!-- Leveling feet -->
  <circle cx="24" cy="110" r="3.5"/>
  <line x1="24" y1="106" x2="24" y2="107"/>
  <circle cx="76" cy="110" r="3.5"/>
  <line x1="76" y1="106" x2="76" y2="107"/>
  <!-- Vertical pillar -->
  <rect x="45" y="18" width="10" height="78" rx="1"/>
  <!-- Controller box (dark, centered on pillar) -->
  <rect x="30" y="48" width="38" height="28" rx="2"/>
  <!-- Cable coil on right of controller -->
  <path d="M68 55 C74 53, 77 58, 74 63 C71 68, 75 72, 78 67" stroke-width="2"/>
  <!-- Horizontal laser arm (top) -->
  <rect x="20" y="14" width="60" height="10" rx="1.5"/>
  <!-- Laser head at right end -->
  <rect x="76" y="16" width="8" height="6" rx="1"/>
  <line x1="80" y1="24" x2="80" y2="28"/>
  <line x1="78" y1="28" x2="82" y2="28"/>
  <!-- Touchscreen (mounted left of pillar, angled) -->
  <rect x="14" y="28" width="24" height="16" rx="2"/>
  <rect x="17" y="31" width="18" height="10" rx="1"/>
  <!-- Adjustment knob on top of pillar -->
  <line x1="50" y1="10" x2="50" y2="14"/>
  <circle cx="50" cy="8" r="3"/>
</svg>
