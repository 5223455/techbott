<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Dark cable/tube with CIJ printed text -->
  <!-- Main cable curve -->
  <path d="M5 70 C20 68, 35 55, 55 48 C75 41, 95 38, 115 35"/>
  <!-- Parallel cable (slightly below) -->
  <path d="M5 80 C20 78, 35 65, 55 58 C75 51, 95 48, 115 45"/>
  <!-- Third cable behind -->
  <path d="M5 60 C20 58, 35 45, 55 38 C75 31, 95 28, 115 25"/>
  <!-- Printed text marks on cables (dashes representing print) -->
  <line x1="38" y1="50" x2="48" y2="47" stroke-width="2.5"/>
  <line x1="52" y1="45" x2="56" y2="44" stroke-width="2.5"/>
  <line x1="62" y1="42" x2="72" y2="39" stroke-width="2.5"/>
  <!-- Text on second cable -->
  <line x1="40" y1="62" x2="50" y2="58" stroke-width="2.5"/>
  <line x1="55" y1="56" x2="60" y2="54" stroke-width="2.5"/>
  <line x1="65" y1="52" x2="75" y2="49" stroke-width="2.5"/>
  <!-- Text on third cable -->
  <line x1="42" y1="40" x2="50" y2="38" stroke-width="2.5"/>
  <line x1="68" y1="32" x2="78" y2="29" stroke-width="2.5"/>
</svg>