<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none" stroke="currentColor" stroke-width="2">
  <!-- Laser head unit -->
  <rect x="15" y="30" width="50" height="35" rx="4"/>
  <!-- Lens/nozzle -->
  <rect x="65" y="40" width="15" height="15" rx="2"/>
  <!-- Laser beam -->
  <line x1="80" y1="47.5" x2="110" y2="47.5" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- Target dot -->
  <circle cx="112" cy="47.5" r="3" stroke-width="2"/>
  <!-- Stand/mount -->
  <line x1="30" y1="65" x2="30" y2="85" stroke-width="2"/>
  <line x1="55" y1="65" x2="55" y2="85" stroke-width="2"/>
  <line x1="20" y1="85" x2="65" y2="85" stroke-width="2"/>
  <!-- Control panel lines -->
  <line x1="22" y1="40" x2="35" y2="40" stroke-width="1.5"/>
  <line x1="22" y1="45" x2="30" y2="45" stroke-width="1.5"/>
  <!-- Cooling vents -->
  <line x1="40" y1="35" x2="40" y2="60" stroke-width="1"/>
  <line x1="45" y1="35" x2="45" y2="60" stroke-width="1"/>
  <line x1="50" y1="35" x2="50" y2="60" stroke-width="1"/>
</svg>
