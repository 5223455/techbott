  <line x1="10" y1="32" x2="54" y2="32" stroke="#9aacb5" stroke-width="0.5" opacity="0.6"/>
  <line x1="10" y1="36" x2="54" y2="36" stroke="#9aacb5" stroke-width="0.5" opacity="0.4"/>
  <line x1="10" y1="40" x2="54" y2="40" stroke="#9aacb5" stroke-width="0.5" opacity="0.6"/>
