  <rect x="26" y="18" width="12" height="8" rx="1" fill="#c4a265" stroke="#8B6914" opacity="0.7"/>
  <!-- Side panel lines -->
  <line x1="10" y1="37" x2="54" y2="37" stroke="#8B6914" opacity="0.4"/>
  <!-- Handle holes -->
  <ellipse cx="22" cy="30" rx="4" ry="2.5" fill="none" stroke="#8B6914"/>
  <ellipse cx="42" cy="30" rx="4" ry="2.5" fill="none" stroke="#8B6914"/>
