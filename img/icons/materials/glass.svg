<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Wine glass bowl -->
  <path d="M20 8h24l-3 20c-.5 3-3 5.5-7 6h-4c-4-.5-6.5-3-7-6L20 8z" fill="#e8f4f8" stroke="#8ab4c7" opacity="0.8"/>
  <!-- Glass rim -->
  <ellipse cx="32" cy="8" rx="12" ry="2.5" fill="#d0eaf4" stroke="#8ab4c7"/>
  <!-- Stem -->
  <line x1="32" y1="34" x2="32" y2="48" stroke="#8ab4c7" stroke-width="2.5"/>
  <!-- Base -->
  <ellipse cx="32" cy="52" rx="10" ry="3" fill="#d0eaf4" stroke="#8ab4c7"/>
  <ellipse cx="32" cy="51" rx="8" ry="2" fill="none" stroke="#8ab4c7" opacity="0.5" stroke-width="1"/>
  <!-- Liquid inside -->
  <path d="M23 18h18l-2 12c-.3 2-2 3.5-5 4h-4c-3-.5-4.7-2-5-4l-2-12z" fill="#f9e4a0" opacity="0.4"/>
  <!-- Reflection/shine -->
  <path d="M25 12c1-1 2-1.5 3-1.5" stroke="#fff" opacity="0.7" stroke-width="1.5"/>
  <path d="M38 14c1 2 1 5 0.5 8" stroke="#fff" opacity="0.3" stroke-width="1"/>
  <!-- Bubbles -->
  <circle cx="28" cy="22" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="34" cy="18" r="0.7" fill="#fff" opacity="0.4"/>
</svg>