<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none" stroke="currentColor" stroke-width="2">
  <!-- Left roll (supply) -->
  <circle cx="35" cy="50" r="25"/>
  <circle cx="35" cy="50" r="10"/>
  <circle cx="35" cy="50" r="4"/>
  <!-- Ribbon winding lines -->
  <circle cx="35" cy="50" r="16" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- Right roll (smaller, take-up) -->
  <circle cx="90" cy="50" r="18"/>
  <circle cx="90" cy="50" r="8"/>
  <circle cx="90" cy="50" r="3"/>
  <!-- Ribbon connecting the rolls -->
  <line x1="35" y1="25" x2="90" y2="32" stroke-width="2"/>
  <line x1="35" y1="75" x2="90" y2="68" stroke-width="2"/>
</svg>
