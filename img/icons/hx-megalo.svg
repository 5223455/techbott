<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 90" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- HX-Megalo - black box TIJ printer with tablet behind -->
  <!-- Tablet/screen behind (larger, tilted back) -->
  <rect x="42" y="4" width="52" height="36" rx="3"/>
  <rect x="46" y="8" width="44" height="28" rx="2"/>
  <!-- Tablet stand notch -->
  <line x1="68" y1="40" x2="68" y2="44"/>
  <!-- Main printer box body (trapezoidal, front-facing) -->
  <path d="M8 28 L8 72 L62 72 L62 28 Z" fill="none"/>
  <!-- Sloped top -->
  <path d="M8 28 L18 20 L72 20 L62 28" fill="none"/>
  <!-- Brand area on front -->
  <rect x="14" y="36" width="42" height="14" rx="1"/>
  <!-- Dot pattern (MapleJet style) -->
  <circle cx="22" cy="56" r="1.5"/>
  <circle cx="28" cy="56" r="1.5"/>
  <circle cx="34" cy="56" r="1.5"/>
  <circle cx="22" cy="62" r="1.5"/>
  <circle cx="28" cy="62" r="1.5"/>
  <!-- Antenna on top-left -->
  <line x1="14" y1="20" x2="14" y2="8"/>
  <circle cx="14" cy="6" r="2"/>
  <!-- Ink cartridge bay (right side, metallic) -->
  <rect x="62" y="40" width="16" height="32" rx="1"/>
  <line x1="66" y1="44" x2="74" y2="44"/>
  <line x1="66" y1="68" x2="74" y2="68"/>
  <!-- Base -->
  <rect x="4" y="72" width="78" height="4" rx="1"/>
</svg>
