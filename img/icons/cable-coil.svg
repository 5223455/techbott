<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Coiled cables (white cables with printed markings) -->
  <!-- Outer coil loop -->
  <ellipse cx="55" cy="55" rx="42" ry="38"/>
  <!-- Inner coil loop -->
  <ellipse cx="55" cy="55" rx="24" ry="20"/>
  <!-- Cable overlap at top -->
  <path d="M30 35 C35 25, 50 20, 65 25"/>
  <!-- Cable overlap at bottom -->
  <path d="M75 72 C70 82, 55 86, 40 80"/>
  <!-- Printed text marks on cable -->
  <line x1="20" y1="45" x2="28" y2="42" stroke-width="2.5"/>
  <line x1="30" y1="41" x2="34" y2="40" stroke-width="2.5"/>
  <line x1="80" y1="45" x2="88" y2="50" stroke-width="2.5"/>
  <line x1="90" y1="52" x2="94" y2="54" stroke-width="2.5"/>
  <!-- More text marks -->
  <line x1="40" y1="88" x2="48" y2="86" stroke-width="2.5"/>
  <line x1="60" y1="22" x2="68" y2="24" stroke-width="2.5"/>
</svg>