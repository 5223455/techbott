<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Banner - Laser Dot Matrix</title>
    <link rel="stylesheet" href="../../css/industrial-banner.css">
</head>
<body>
    <div class="industrial-banner">
        <!-- Background layers -->
        <div class="bg-layer bg-gradient"></div>
        <div class="bg-layer bg-grid"></div>
        <div class="bg-layer bg-world-map"></div>
        <div class="bg-layer bg-tech-pattern"></div>
        
        <!-- Content -->
        <div class="banner-content">
            <h1 class="laser-title">
                <span class="laser-dots laser-white">WELCOME TO</span>
                <span class="laser-dots laser-orange">TECHBOTT INDIA</span>
            </h1>
            <p class="banner-subtitle">Premium Industrial Automation & Coding Solutions</p>
        </div>
        
        <!-- Decorative elements -->
        <div class="tech-accent accent-1"></div>
        <div class="tech-accent accent-2"></div>
        <div class="tech-accent accent-3"></div>
    </div>
    <script src="/js/offline-handler.js"></script>
</body>
</html>
